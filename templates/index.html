<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FishTank Pro - 智慧監控中心</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .sticky-video { position: sticky; top: 0; z-index: 40; background: #000; }
        #video-container { cursor: default; touch-action: none; user-select: none; background: #000; }
        #video-stream { 
            width: 100%; height: 100%; object-fit: contain;
            transform-origin: center center;
            pointer-events: none; transition: transform 0.1s ease-out;
        }
        #video-container:fullscreen { width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .zoom-active { cursor: grab !important; }
        .grabbing { cursor: grabbing !important; }
        .modal-bg { background-color: rgba(0, 0, 0, 0.7); z-index: 100; }
        .modal-content { z-index: 110; }

        /* 星期選擇樣式 */
        .day-btn { @apply border border-gray-300 rounded-md px-2 py-1 text-sm transition-colors; }
        .day-btn.active { @apply bg-blue-600 text-white border-blue-600; }
    </style>
</head>
<body class="bg-gray-100 font-sans">

    <div class="sticky-video shadow-lg">
        <div id="video-container" class="max-w-5xl mx-auto aspect-video relative overflow-hidden">
            <video id="video-stream" autoplay loop muted playsinline>
                <source src="/static/resource/demo.mp4" type="video/mp4">
            </video>
            
            <div id="fs-controls" class="absolute top-4 right-4 flex space-x-4 z-50" onclick="event.stopPropagation()">
                <button onclick="triggerFeed()" class="text-3xl hover:scale-110 transition-transform">
                    <span id="icon-feed">🍖</span>
                </button>
                <button id="btn-light-icon" onclick="toggleLight()" class="hover:scale-110 transition-transform">
                    <img id="icon-light" src="/static/resource/light_off.png" class="w-8 h-8 object-contain">
                </button>
            </div>

            <button onclick="toggleFS(event)" class="absolute bottom-4 right-4 bg-black/40 text-white px-3 py-1 rounded text-sm hover:bg-black/60 z-50">
                ⛶ 全螢幕
            </button>
        </div>
    </div>

    <div class="max-w-5xl mx-auto p-4 space-y-6">
        <div class="bg-white rounded-xl p-6 shadow-sm border-l-4 border-blue-500 space-y-2">
            <div class="flex justify-between items-center">
                <div>
                    <h1 class="text-xl font-bold">智慧魚缸監控系統</h1>
                    <p class="text-gray-500 text-sm">最後餵食：<span id="last-fed-time" class="text-blue-600 font-medium">--:--</span></p>
                </div>
                <div class="text-right">
                    <span id="temp-display" class="text-3xl font-mono font-bold text-blue-500">26.5°C</span>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <button onclick="openManager('auto_feed')" class="bg-white border border-gray-200 py-4 rounded-xl font-medium shadow-sm hover:shadow-md transition">📅 餵食排程管理</button>
            <button onclick="openManager('auto_water_change')" class="bg-white border border-gray-200 py-4 rounded-xl font-medium shadow-sm hover:shadow-md transition">💧 換水排程管理</button>
            
            <button id="main-btn-light" onclick="toggleLight()" class="bg-gray-800 text-white py-4 rounded-xl font-bold shadow-md flex items-center justify-center transition-all active:scale-95">
                <img id="main-icon-light" src="/static/resource/light_off.png" class="w-5 h-5 mr-2 object-contain">
                <span id="main-text-light">開啟燈光</span>
            </button>
            
            <button id="main-btn-feed" onclick="triggerFeed()" class="bg-red-600 text-white py-4 rounded-xl font-bold shadow-md transition-all active:scale-95 disabled:opacity-50">
                <span id="main-text-feed">🚀 立即餵食</span>
            </button>
        </div>
    </div>

    <div id="manager-modal" class="fixed inset-0 modal-bg hidden flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-md rounded-2xl shadow-2xl overflow-hidden modal-content">
            <div class="p-4 border-b flex justify-between items-center bg-gray-50">
                <h2 id="modal-title" class="font-bold text-lg">排程管理</h2>
                <button onclick="closeManager()" class="text-2xl text-gray-400 hover:text-black">&times;</button>
            </div>
            
            <div id="schedule-list" class="p-4 space-y-3 max-h-64 overflow-y-auto"></div>

            <div class="p-4 bg-gray-50 border-t space-y-4">
                <div class="flex justify-between gap-1">
                    <button class="day-btn flex-1" data-day="1">一</button>
                    <button class="day-btn flex-1" data-day="2">二</button>
                    <button class="day-btn flex-1" data-day="3">三</button>
                    <button class="day-btn flex-1" data-day="4">四</button>
                    <button class="day-btn flex-1" data-day="5">五</button>
                    <button class="day-btn flex-1" data-day="6">六</button>
                    <button class="day-btn flex-1" data-day="0">日</button>
                </div>
                
                <div class="flex space-x-2">
                    <select id="new-hour" class="flex-1 border rounded p-2 outline-none">
                        </select>
                    <select id="new-minute" class="flex-1 border rounded p-2 outline-none">
                        <option value="00">00 分</option>
                        <option value="10">10 分</option>
                        <option value="20">20 分</option>
                        <option value="30">30 分</option>
                        <option value="40">40 分</option>
                        <option value="50">50 分</option>
                    </select>
                    <button onclick="addItem()" class="bg-blue-600 text-white px-4 py-2 rounded font-bold hover:bg-blue-700">新增</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let config = {};
        let activeType = '';
        let isFeeding = false;
        const dayNames = ["日", "一", "二", "三", "四", "五", "六"];

        // 初始化小時選單
        const hourSelect = document.getElementById('new-hour');
        for(let i=0; i<24; i++) {
            let h = i.toString().padStart(2, '0');
            hourSelect.innerHTML += `<option value="${h}">${h} 點</option>`;
        }

        // 星期按鈕點擊事件
        document.querySelectorAll('.day-btn').forEach(btn => {
            btn.addEventListener('click', () => btn.classList.toggle('active'));
        });

        async function loadConfig() {
            try {
                const res = await fetch('/api/config');
                config = await res.json();
                updateStatusUI();
                if(activeType) renderList(); 
            } catch (e) { console.error(e); }
        }

        function updateStatusUI() {
            const status = config.device_status;
            document.getElementById('last-fed-time').innerText = status.last_fed || "無紀錄";
            
            // 同步燈光按鈕狀態
            const isLightOn = status.light === "on";
            const path = isLightOn ? '/static/resource/light_on.png' : '/static/resource/light_off.png';
            document.getElementById('icon-light').src = path;
            document.getElementById('main-icon-light').src = path;
            document.getElementById('main-text-light').innerText = isLightOn ? '關閉燈光' : '開啟燈光';
            const btn = document.getElementById('main-btn-light');
            if(isLightOn) btn.classList.replace('bg-gray-800', 'bg-yellow-500'); 
            else btn.classList.replace('bg-yellow-500', 'bg-gray-800');
        }

        async function triggerFeed() {
            if (isFeeding) return;
            isFeeding = true;
            const mainBtn = document.getElementById('main-btn-feed');
            const mainText = document.getElementById('main-text-feed');
            const originalText = mainText.innerText;

            mainText.innerText = '餵食中...';
            mainBtn.disabled = true;
            mainBtn.classList.replace('bg-red-600', 'bg-gray-400');

            try {
                const res = await fetch('/api/action', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({action: 'feed'})
                });
                await loadConfig(); // 動作完重新讀取時間
            } finally {
                isFeeding = false; 
                mainText.innerText = originalText;
                mainBtn.disabled = false;
                mainBtn.classList.replace('bg-gray-400', 'bg-red-600');
            }
        }

        async function toggleLight() {
            const current = config.device_status.light === "on" ? 'light_off' : 'light_on';
            await fetch('/api/action', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({action: current})
            });
            await loadConfig();
        }

        function openManager(type) {
            activeType = type;
            document.getElementById('modal-title').innerText = type === 'auto_feed' ? '📅 餵食排程管理' : '💧 換水排程管理';
            renderList();
            document.getElementById('manager-modal').classList.remove('hidden');
        }

        function closeManager() {
            document.getElementById('manager-modal').classList.add('hidden');
        }

        function renderList() {
            const list = document.getElementById('schedule-list');
            const items = config[activeType] || [];
            list.innerHTML = items.map(item => {
                const dayStr = item.days.sort().map(d => dayNames[d]).join(', ');
                return `
                <div class="flex justify-between items-center p-3 bg-white border rounded-lg shadow-sm">
                    <div>
                        <span class="font-mono font-bold text-lg">${item.time}</span>
                        <div class="text-xs text-blue-600">每週 (${dayStr})</div>
                    </div>
                    <div class="flex items-center space-x-3">
                        <input type="checkbox" ${item.enabled ? 'checked' : ''} onchange="toggleEnable(${item.id})" class="w-5 h-5">
                        <button onclick="deleteItem(${item.id})" class="text-red-500 text-sm">刪除</button>
                    </div>
                </div>`;
            }).join('') || '<p class="text-center text-gray-400 py-4">目前無排程</p>';
        }

        async function addItem() {
            const h = document.getElementById('new-hour').value;
            const m = document.getElementById('new-minute').value;
            const selectedDays = Array.from(document.querySelectorAll('.day-btn.active')).map(b => parseInt(b.dataset.day));
            
            if(selectedDays.length === 0) return alert("請至少選擇一個星期");

            const newItem = {
                id: Date.now(),
                time: `${h}:${m}`,
                days: selectedDays,
                enabled: true
            };
            
            config[activeType].push(newItem);
            await saveConfig();
            renderList();
        }

        async function toggleEnable(id) {
            const item = config[activeType].find(i => i.id === id);
            item.enabled = !item.enabled;
            await saveConfig();
        }

        async function deleteItem(id) {
            config[activeType] = config[activeType].filter(i => i.id !== id);
            await saveConfig();
            renderList();
        }

        async function saveConfig() {
            await fetch('/api/config', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(config)
            });
        }

        // 影片控制 (省略重複的 FS 與 Pinch 邏輯...)
        function toggleFS(e) { e.stopPropagation(); if (!document.fullscreenElement) container.requestFullscreen(); else document.exitFullscreen(); }

        loadConfig();
    </script>
</body>
</html>
